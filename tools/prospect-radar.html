<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Prospect Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: analyst workbench. Left rail = brief + history; right = a dossier-style report with a sticky section index.
   Single light theme by request. */
:root {
  color-scheme: light;
  --bg: #f4f5f8;
  --surface: #ffffff;
  --sunk: #f1f3f7;
  --ink: #111827;
  --muted: #566074;
  --faint: #8a93a6;
  --line: #e2e6ee;
  --accent: #2b45c0;
  --accent-soft: #ebeefc;
  --rose: #b0446e;
  --rose-soft: #fbedf3;
  --good: #1d7347;
  --good-soft: #e3f3ea;
  --warn: #9a5b06;
  --warn-soft: #fdf1d8;
  --bad: #b42318;
  --bad-soft: #fde9e7;
  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-ui: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
ul, ol { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cap { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.muted { color: var(--muted); }
.shell { max-width: 1320px; margin-inline: auto; }

/* Top bar */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--font-display); font-weight: 500; font-size: 24px; letter-spacing: -0.01em; }
.brand span { font-family: var(--font-mono); font-size: 12px; color: var(--faint); }
.pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.live { background: var(--good-soft); color: var(--good); } .pill.live::before { background: var(--good); }
.pill.know { background: var(--accent-soft); color: var(--accent); } .pill.know::before { background: var(--accent); }
.pill.off { background: var(--warn-soft); color: var(--warn); } .pill.off::before { background: var(--warn); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px/1 var(--font-ui); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); color: #fff; }
.btn.sm { font-size: 12.5px; padding: 6px 10px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }

/* Workbench */
.bench { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; padding-top: 20px; }
.rail { display: grid; gap: 16px; position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow: auto; padding-bottom: 8px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--faint); font-weight: 400; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
input[type="text"], input[type="password"], textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 70px; line-height: 1.45; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.run { display: flex; gap: 8px; } .run .primary { flex: 1; }

.steps { list-style: none; padding: 0; display: grid; gap: 7px; font-size: 13px; }
.steps li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; color: var(--faint); text-align: left; }
.steps li::before { content: "\25CB"; font-size: 11px; }
.steps li.now { color: var(--ink); } .steps li.now::before { content: "\25D4"; color: var(--accent); animation: spin 1.2s linear infinite; display: inline-block; }
.steps li.done { color: var(--muted); } .steps li.done::before { content: "\25CF"; color: var(--good); }
.steps li.fail { color: var(--bad); } .steps li.fail::before { content: "\25CF"; color: var(--bad); }
.steps li.skip::before { content: "\25CC"; }
.steps .t { font-family: var(--font-mono); font-size: 11.5px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.now::before { animation: none; } }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; }

.hist { display: grid; }
.hist button { font: inherit; font-size: 13.5px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 2px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; cursor: pointer; color: var(--ink); }
.hist button:hover b, .hist button[aria-current="true"] b { color: var(--accent); }
.hist b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist small { grid-column: 1; color: var(--faint); font-family: var(--font-mono); font-size: 11px; }
.hist .score { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: 5px; }

/* Report */
.report { display: grid; gap: 16px; min-width: 0; }
.cover { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 28px; }
.cover h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(28px, 4vw, 38px); line-height: 1.1; letter-spacing: -0.01em; }
.cover .dom { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.cover .one { font-size: 16px; margin-top: 8px; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--rose-soft); color: var(--rose); vertical-align: middle; margin-left: 10px; letter-spacing: 0.02em; }
.gauge { display: grid; justify-items: center; gap: 4px; align-content: start; }
.gauge svg { width: 104px; height: 104px; }
.gauge .track { fill: none; stroke: var(--sunk); stroke-width: 9; }
.gauge .val { fill: none; stroke-width: 9; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 52px 52px; }
.gauge text { font-family: var(--font-display); font-size: 30px; font-weight: 500; fill: var(--ink); }
.prio { font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 999px; }
.prio.Hot { background: var(--bad-soft); color: var(--bad); }
.prio.Warm { background: var(--warn-soft); color: var(--warn); }
.prio.Cold { background: var(--sunk); color: var(--muted); }
.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }

.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.toc a { font-size: 12.5px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
.toc a:hover { color: var(--accent); background: var(--surface); border-color: var(--line); }

.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; display: grid; gap: 16px; min-width: 0; scroll-margin-top: 56px; }
.sec h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -0.005em; }
.sec h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.lead { font-size: 15.5px; max-width: 78ch; }
.callout { border-left: 3px solid var(--rose); padding: 4px 0 4px 14px; font-size: 15px; }
.callout b { display: block; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rose); font-weight: 500; margin-bottom: 2px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; }
.cols > * { min-width: 0; }
.list { padding-left: 1.1em; display: grid; gap: 5px; font-size: 14px; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.facts div { padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.facts dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
.facts dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.facts dd.na { color: var(--faint); }

.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.person { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; font-size: 13.5px; align-content: start; }
.person b { font-size: 14.5px; }
.person .role { color: var(--muted); }

.ev { display: grid; grid-template-columns: 84px 100px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ev:first-child { border-top: 0; padding-top: 0; }
.ev .d { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 1px; }
.ev .ty { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); justify-self: start; height: fit-content; }
.ev .imp { color: var(--muted); font-size: 13.5px; }
.ev .imp::before { content: "So what: "; font-weight: 600; color: var(--rose); }

.audit-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.maturity { display: grid; justify-items: center; padding: 10px 16px; border-radius: 8px; background: var(--sunk); }
.maturity b { font-family: var(--font-display); font-size: 34px; font-weight: 500; line-height: 1; }
.maturity small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.chan { display: grid; grid-template-columns: 190px 96px minmax(0, 1fr); gap: 6px 18px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px; }
.chan .nm { font-weight: 700; }
.dots { display: inline-flex; gap: 3px; padding-top: 5px; }
.dots i { width: 14px; height: 8px; border-radius: 2px; background: var(--sunk); border: 1px solid var(--line); }
.dots.s1 i:nth-child(-n+1), .dots.s2 i:nth-child(-n+2) { background: var(--bad); border-color: var(--bad); }
.dots.s3 i:nth-child(-n+3) { background: var(--warn); border-color: var(--warn); }
.dots.s4 i:nth-child(-n+4), .dots.s5 i:nth-child(-n+5) { background: var(--good); border-color: var(--good); }
.chan .body { display: grid; gap: 5px; }
.chan .k { font-weight: 700; margin-right: 5px; color: var(--muted); }
.chan .gp .k { color: var(--bad); }
.chan .fx .k { color: var(--good); }

.tech { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.grp { display: grid; gap: 6px; align-content: start; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 12.5px; padding: 3px 8px; border-radius: 5px; background: var(--good-soft); color: var(--good); font-weight: 600; }
.chip.no { background: var(--sunk); color: var(--faint); font-weight: 500; }
.socials { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; font-size: 13.5px; }
.small { font-size: 12.5px; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px 10px 0; border-top: 1px solid var(--line); }
th { font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); border-top: 0; padding-top: 0; }
td:first-child { font-weight: 600; }

.pain { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 14px; padding: 13px 0; border-top: 1px solid var(--line); font-size: 14px; }
.pain:first-child { border-top: 0; padding-top: 0; }
.pain > div { display: grid; gap: 3px; }
.sev { font-family: var(--font-mono); font-size: 11px; padding: 2px 0; border-radius: 4px; text-align: center; height: fit-content; }
.sev.High { background: var(--bad-soft); color: var(--bad); }
.sev.Medium { background: var(--warn-soft); color: var(--warn); }
.sev.Low { background: var(--sunk); color: var(--muted); }
.pain b { font-size: 15px; }
.pain .ev2 { color: var(--muted); }
.pain .imp2::before { content: "Business impact: "; font-weight: 600; }

.fitbars { display: grid; gap: 14px; }
.fb { display: grid; grid-template-columns: 200px minmax(0, 1fr) 44px; gap: 4px 14px; align-items: center; font-size: 14px; }
.fb .bar { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.fb .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.fb.top .bar i { background: var(--rose); }
.fb .pct { font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.fb .why { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.fb .dl { display: block; color: var(--ink); margin-top: 2px; }
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.plan div { padding: 12px 14px; border-right: 1px solid var(--line); font-size: 14px; display: grid; gap: 4px; align-content: start; }
.plan div:last-child { border-right: 0; }
.pitchbox { background: var(--accent-soft); border-radius: 8px; padding: 16px 18px; display: grid; gap: 6px; }
.pitchbox .svc { font-family: var(--font-display); font-size: 25px; font-weight: 500; line-height: 1.15; }

.mail { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mail > header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); }
.mail > header .cap { color: var(--muted); }
.mail .bd { white-space: pre-wrap; padding: 14px 16px; font-size: 14.5px; line-height: 1.65; overflow-wrap: anywhere; }
.mail .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.wc { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-right: 4px; }
.subj { display: grid; gap: 5px; list-style: none; padding: 0; }
.subj li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; background: var(--sunk); border-radius: 6px; font-size: 14px; }
.subj li span { min-width: 0; overflow-wrap: anywhere; }
.qa { display: grid; gap: 12px; }
.qa div { display: grid; gap: 2px; font-size: 14px; }
.qa span { color: var(--muted); }

.refs { display: inline-flex; gap: 3px; margin-left: 5px; vertical-align: 1px; }
.refs a, .refs span { font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; line-height: 1; padding: 2px 4px; border-radius: 3px; background: var(--sunk); color: var(--muted); text-decoration: none; border: 1px solid var(--line); }
.refs a:hover { color: var(--accent); border-color: var(--accent); }
.srcs { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 5px 10px; font-size: 13px; }
.srcs .id { font-family: var(--font-mono); color: var(--faint); }
.srcs a, .srcs span { overflow-wrap: anywhere; }
details.raw summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
details.raw pre { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12px; line-height: 1.5; background: var(--sunk); padding: 12px; border-radius: 6px; max-height: 420px; overflow: auto; margin: 8px 0 0; }
.conf { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; padding: 2px 8px; border-radius: 4px; }
.conf.High { background: var(--good-soft); color: var(--good); }
.conf.Medium { background: var(--warn-soft); color: var(--warn); }
.conf.Low { background: var(--bad-soft); color: var(--bad); }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(17, 24, 39, 0.35); }
dialog .dl { padding: 20px; display: grid; gap: 14px; }
dialog h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 600; }
.check input { margin-top: 3px; }
.check .hint { font-weight: 400; color: var(--faint); }
#profile { min-height: 220px; font-family: var(--font-mono); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 20; }

@media (max-width: 980px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; overflow: visible; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .cover { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .gauge { justify-items: start; grid-auto-flow: column; align-items: center; justify-content: start; gap: 12px; }
  .gauge svg { width: 80px; height: 80px; }
  .sec { padding: 16px; }
  .cols, .plan, .facts, .row2 { grid-template-columns: minmax(0, 1fr); }
  .plan div { border-right: 0; border-bottom: 1px solid var(--line); }
  .ev { grid-template-columns: minmax(0, 1fr) auto; }
  .ev > div { grid-column: 1 / -1; }
  .ev .ty { justify-self: end; }
  .chan { grid-template-columns: minmax(0, 1fr) auto; }
  .chan .body { grid-column: 1 / -1; }
  .fb { grid-template-columns: minmax(0, 1fr) 40px; }
  .fb .bar { grid-column: 1 / -1; grid-row: 2; }
  .fb .why { grid-column: 1 / -1; }
  .audit-top { grid-template-columns: minmax(0, 1fr); justify-items: start; }
}
@media print {
  body { background: #fff; padding: 0; font-size: 12px; }
  .top, .rail, .toc, .actions, .btn, .mail .tools, .toast { display: none !important; }
  .bench { display: block; padding: 0; }
  .sec, .cover { break-inside: avoid-page; margin-bottom: 12px; }
  details.raw { display: none; }
}
</style>

<div class="shell">
  <header class="top">
    <div class="brand"><b>Prospect Radar</b><span>Rarecraft · v5</span></div>
    <span class="pill" id="enginePill">Checking engine</span>
    <button class="btn sm" type="button" id="dlBtn" hidden>Download live version</button>
    <button class="btn sm" type="button" id="settingsBtn">Settings</button>
  </header>

  <div class="bench">
    <aside class="rail">
      <form class="box" id="form" autocomplete="off">
        <p class="cap">New research</p>
        <div class="field">
          <label for="site">Company website</label>
          <input type="text" id="site" placeholder="acme.com" required>
        </div>
        <div class="field">
          <label for="cname">Company name <span class="hint">optional</span></label>
          <input type="text" id="cname" placeholder="Acme">
        </div>
        <div class="row2">
          <div class="field"><label for="pname">Contact <span class="hint">optional</span></label><input type="text" id="pname" placeholder="First name"></div>
          <div class="field"><label for="prole">Role</label><input type="text" id="prole" placeholder="CMO"></div>
        </div>
        <div class="field">
          <label for="notes">Context <span class="hint">optional</span></label>
          <textarea id="notes" placeholder="How we found them, LinkedIn About text, a job post, call notes"></textarea>
        </div>
        <div class="run">
          <button class="btn primary" type="submit" id="goBtn" disabled>Run research</button>
